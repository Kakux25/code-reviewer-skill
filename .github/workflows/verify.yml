name: Verify

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  integrity:
    name: Eval harness integrity (deterministic, no LLM)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run integrity gate
        run: python3 evals/check_integrity.py
        env:
          PYTHONDONTWRITEBYTECODE: "1"
